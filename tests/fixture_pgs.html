let cat=null, caricato=false;
function lista(voci, el, onPick){
  document.querySelectorAll('ul[role=listbox]').forEach(u=>u.remove());
  const ul=document.createElement('ul'); ul.setAttribute('role','listbox');
  voci.forEach(v=>{const li=document.createElement('li'); li.setAttribute('role','option'); li.textContent=v; li.onclick=()=>{ul.remove(); onPick(v)}; ul.appendChild(li)});
  document.body.appendChild(ul);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('ul[role=listbox]').forEach(u=>u.remove())});
document.querySelector('[data-k=camp]').onclick=function(){lista(CAMP,this,v=>{this.textContent=v})};
document.querySelector('[data-k=cat]').onclick=function(){ if(!caricato) return; lista(Object.keys(CAT),this,v=>{this.textContent=v;cat=v;document.getElementById('available-teams').value='';document.getElementById('out').innerHTML=''}) };
setTimeout(()=>{caricato=true; document.querySelector('[data-k=cat]').textContent='Mista 2° Livello'; cat='Mista 2° Livello'},700);
const inp=document.getElementById('available-teams');
inp.onclick=()=>{ if(!cat) return; setTimeout(()=>lista(CAT[cat],inp,v=>{inp.value=v; setTimeout(()=>{document.getElementById('out').innerHTML=v.includes('CUSAGO')?TAB_NEW:TAB_ARC.split('ARCUS VOLLEY ORO').join(v)},600)}),300) };
</script></body></html>
